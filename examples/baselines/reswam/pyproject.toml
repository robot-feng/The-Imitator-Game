[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reswam-starter"
version = "0.1.0"
description = "Research prototype: causal video ICL, two-frame latent residuals, test-time residual memory, conditional flow matching"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.3",
  "torchvision>=0.18",
  "timm>=1.0.20",
  "Pillow>=10",
  "numpy>=1.24",
  "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
